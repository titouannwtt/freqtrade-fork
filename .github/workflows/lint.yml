name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        # Pinned to the version in requirements-dev.txt: an unpinned "ruff>=0.6"
        # silently picks up every new release, so newly-introduced rules turn a
        # green build red without a single line of code changing.
        run: grep -E '^ruff==' requirements-dev.txt | xargs pip install

      - name: Ruff check
        run: ruff check freqtrade/

      - name: Ruff format (check only)
        run: ruff format --check freqtrade/
